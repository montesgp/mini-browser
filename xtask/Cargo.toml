[package]
name = "xtask"
description = "Build tools for mini-browser: `bundle` builds the app and lays out a runnable CEF bundle."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bundle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `sandbox` selects the bundle layout: on Windows, `bootstrap.exe` renamed to the app plus the
# app library; it must match the app's default `sandbox` feature.
cef = { version = "=156.2.0", default-features = false, features = ["build-util", "sandbox"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
semver = "1"
