name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # CMake ships with every hosted runner; Ninja does not on all of them.
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Cache cargo and CEF downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Core tests
        run: cargo test -p mini-core

      - name: App tests
        run: cargo test -p minibrowser --lib

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Bundle
        run: cargo run -p xtask --bin bundle -- minibrowser -o target/bundle

      # Compiling is not enough: the executable must find libcef.so and its other libraries.
      - name: Bundle resolves its shared libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          readelf -d target/bundle/minibrowser | grep -E 'RUNPATH|RPATH'
          if ldd target/bundle/minibrowser | grep 'not found'; then exit 1; fi

  # Single required check for branch protection: green only when every build passed.
  ci-gate:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require all builds to pass
        run: test "${{ needs.build.result }}" = "success"
